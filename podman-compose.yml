version: '3.9'

# SRE Audit stack for Podman.
#
# Local laptop workflow (recommended):
#   ./scripts/build-and-scp.sh user@vm:/path/to/Jira-Dashboard-Automations
#   # on VM:
#   ./scripts/load-and-deploy-vm.sh
#
# Images are pinned so the VM can `podman load` prebuilt tarballs and start
# with --no-build (no npm/build tools required on the VM).
#
# Mail/Jira secrets come from env_file (.env.local) only.
# Tinyproxy on the VM host is reached via extra_hosts → host-gateway.

services:
  redis-cache:
    image: docker.io/library/redis:7-alpine
    container_name: jira-redis-cache
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--loglevel", "notice"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jira-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend-api:
    image: ${BACKEND_IMAGE:-localhost/jira-dashboard-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jira-backend-api
    depends_on:
      redis-cache:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # SMTP uses SMTP_PROXY only. Never let system proxy hijack Jira or Redis.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    extra_hosts:
      - "tinyproxy:host-gateway"
      - "host.containers.internal:host-gateway"
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - jira-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-app:
    image: ${FRONTEND_IMAGE:-localhost/jira-dashboard-frontend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jira-frontend-app
    depends_on:
      backend-api:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      BACKEND_API_URL: http://backend-api:5000/api/v1
      NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-http://backend-api:5000/api/v1}
      NODE_ENV: production
      PORT: 3000
      # Critical: env_file may set HTTP_PROXY=tinyproxy for SMTP docs; that breaks
      # Next.js server fetch to backend-api. Clear proxies; BFF also uses a direct agent.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    ports:
      - "3000:3000"
    networks:
      - jira-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  jira-network:
    driver: bridge
